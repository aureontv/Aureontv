name: Build Control Hub Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "app.js"
      - "native-entry.js"
      - "styles.css"
      - "native/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Add secure WebSocket transport dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          if not p.exists():
              p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("No se encontró el archivo Gradle del módulo Android")
          s = p.read_text()
          dependency = 'implementation "com.squareup.okhttp3:okhttp:4.12.0"'
          if p.suffix == ".kts":
              dependency = 'implementation("com.squareup.okhttp3:okhttp:4.12.0")'
          if "com.squareup.okhttp3:okhttp" not in s:
              pos = s.rfind("dependencies {")
              if pos < 0:
                  raise SystemExit("No se encontró el bloque dependencies de Gradle")
              end = s.find("}", pos)
              if end < 0:
                  raise SystemExit("Bloque dependencies incompleto")
              s = s[:end] + "    " + dependency + chr(10) + s[end:]
              p.write_text(s)
          PY
      - name: Enable Kotlin for the native TV plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          if not root.exists():
              raise SystemExit("No se encontró android/build.gradle")
          root_text = root.read_text()
          dependency = 'classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"'
          if "kotlin-gradle-plugin" not in root_text:
              if "buildscript {" in root_text:
                  start = root_text.index("buildscript {")
                  dep = root_text.index("dependencies {", start)
                  end = root_text.index("}", dep)
                  root_text = root_text[:end] + "    " + dependency + chr(10) + root_text[end:]
              else:
                  block = 'buildscript { repositories { google(); mavenCentral() }; dependencies { ' + dependency + ' } }' + chr(10)
                  root_text = block + root_text
              root.write_text(root_text)
          app = Path("android/app/build.gradle")
          if not app.exists():
              raise SystemExit("No se encontró android/app/build.gradle")
          app_text = app.read_text()
          if "org.jetbrains.kotlin.android" not in app_text:
              app.write_text(app_text + chr(10) + "apply plugin: 'org.jetbrains.kotlin.android'" + chr(10))
          PY
      - name: Register Control Hub TV discovery plugin
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/controlhub/tv android/app/src/main/java/com/aureontv/controlhub
          cp native/android/ControlHubTVPlugin.kt android/app/src/main/java/com/controlhub/tv/ControlHubTVPlugin.kt
          cat > android/app/src/main/java/com/aureontv/controlhub/MainActivity.java <<'JAVA'
          package com.aureontv.controlhub;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.controlhub.tv.ControlHubTVPlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ControlHubTVPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          find android/app/src/main/java -name 'MainActivity.kt' -delete
      - name: Add local network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<application'
          permissions = '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' + chr(10)
          if "android.permission.ACCESS_NETWORK_STATE" not in s:
              s = s.replace(marker, permissions + marker, 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: control-hub-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
