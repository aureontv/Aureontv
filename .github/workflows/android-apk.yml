name: Build Control Hub Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "app.js"
      - "native-entry.js"
      - "styles.css"
      - "native/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Add secure WebSocket transport dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          if not p.exists():
              p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("No se encontró el archivo Gradle del módulo Android")
          s = p.read_text()
          dependency = 'implementation "com.squareup.okhttp3:okhttp:4.12.0"'
          if p.suffix == ".kts":
              dependency = 'implementation("com.squareup.okhttp3:okhttp:4.12.0")'
          if "com.squareup.okhttp3:okhttp" not in s:
              pos = s.rfind("dependencies {")
              if pos < 0:
                  raise SystemExit("No se encontró el bloque dependencies de Gradle")
              end = s.find("}", pos)
              if end < 0:
                  raise SystemExit("Bloque dependencies incompleto")
              s = s[:end] + "    " + dependency + chr(10) + s[end:]
              p.write_text(s)
          PY
      - name: Enable Kotlin for the native TV plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          root_kts = Path("android/build.gradle.kts")
          app = Path("android/app/build.gradle")
          app_kts = Path("android/app/build.gradle.kts")
          if root.exists():
              p = root
              root_line = "plugins { id 'org.jetbrains.kotlin.android' version '2.0.21' apply false }\n"
          elif root_kts.exists():
              p = root_kts
              root_line = 'plugins { id("org.jetbrains.kotlin.android") version "2.0.21" apply false }\n'
          else:
              raise SystemExit("No se encontró el Gradle raíz de Android")
          root_text = p.read_text()
          if "org.jetbrains.kotlin.android" not in root_text:
              root_plugin = "id 'org.jetbrains.kotlin.android' version '2.0.21' apply false"
              if "plugins {" in root_text:
                  root_text = root_text.replace("plugins {", "plugins { " + root_plugin, 1)
                  p.write_text(root_text)
              else:
                  p.write_text(root_line + root_text)
          if app.exists():
              q = app
              app_plugin = "    id 'org.jetbrains.kotlin.android'\n"
          elif app_kts.exists():
              q = app_kts
              app_plugin = '    id("org.jetbrains.kotlin.android")\n'
          else:
              raise SystemExit("No se encontró el Gradle del módulo Android")
          app_text = q.read_text()
          if "org.jetbrains.kotlin.android" not in app_text:
              if "plugins {" not in app_text:
                  raise SystemExit("El módulo Android no tiene bloque plugins")
              app_text = app_text.replace("plugins {", "plugins {\n" + app_plugin, 1)
              q.write_text(app_text)
          PY
      - name: Register Control Hub TV discovery plugin
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/controlhub/tv android/app/src/main/java/com/aureontv/controlhub
          cp native/android/ControlHubTVPlugin.kt android/app/src/main/java/com/controlhub/tv/ControlHubTVPlugin.kt
          cat > android/app/src/main/java/com/aureontv/controlhub/MainActivity.java <<'JAVA'
          package com.aureontv.controlhub;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.controlhub.tv.ControlHubTVPlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ControlHubTVPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          find android/app/src/main/java -name 'MainActivity.kt' -delete
      - name: Add local network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<application'
          permissions = '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' + chr(10)
          if "android.permission.ACCESS_NETWORK_STATE" not in s:
              s = s.replace(marker, permissions + marker, 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: control-hub-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
